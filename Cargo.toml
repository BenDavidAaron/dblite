[package]
name = "dblite"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A lightweight, embeddable Key/Value store. Inspired by SQLite. Vibe coded over a holiday."

[lib]
name = "dblite"
path = "src/lib.rs"

[[bin]]
name = "dblite"
path = "src/main.rs"

[dependencies]
fs4 = "0.7"
humantime = "2"
rustyline = "12"

[dev-dependencies]
tempfile = "3"
